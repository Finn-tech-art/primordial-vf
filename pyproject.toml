[project]
name = "primordial-vf"
version = "0.1.0"
description = "Primordial VF / Voice Forge: dual-lane factual and stylistic RAG agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Primordial VF" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",

    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",

    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"